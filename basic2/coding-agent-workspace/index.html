<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Table Demo</title>
    <!-- Tailwind Play CDN for quick static demos (development-only) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto py-10 px-4">
      <h1 class="text-2xl font-semibold mb-6 text-gray-900">
        Team Members
      </h1>

      <div class="mb-4">
        <label for="nameFilter" class="block text-sm font-medium text-gray-700 mb-1">
          Filter by name
        </label>
        <input
          id="nameFilter"
          type="text"
          placeholder="Start typing a name..."
          class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none bg-white"
        />
      </div>

      <div class="overflow-x-auto bg-white shadow-sm rounded-lg border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Name
              </th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Role
              </th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Status
              </th>
            </tr>
          </thead>
          <tbody id="peopleTableBody" class="divide-y divide-gray-200 text-sm text-gray-700">
            <!-- Rows will be rendered by app.js -->
          </tbody>
        </table>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
